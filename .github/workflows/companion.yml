name: Deploy companion

# Publishes dist/companion (the Owlbear Rodeo extension) to GitHub Pages so
# Owlbear Rodeo can install it by manifest URL.
#
# dist/ is gitignored, so the site is built here rather than committed.
# The manifest ends up at https://<user>.github.io/<repo>/manifest.json

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Fail loudly instead of uploading an empty site if the build output moves.
      - name: Check companion output
        run: test -f dist/companion/manifest.json && test -f dist/companion/page.js

      # enablement: true turns Pages on (Source: GitHub Actions) on the first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/companion

      - id: deployment
        uses: actions/deploy-pages@v4
